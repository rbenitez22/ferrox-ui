[package]
name        = "ferrox-icons"
description = "SVG icons for Leptos CSR apps: each icon a value, drawn by one Icon component."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
authors.workspace    = true
# One copy per build: Cargo allows one package per `links` value, so an app
# that pulls in two ferrox versions (a different tag, or the same tag through
# another URL) fails to resolve, naming both, instead of compiling two copies
# whose types, theme state and CSS don't mix. Not a native library.
links = "ferrox-icons"

[dependencies]
leptos = { workspace = true }
# icon!, re-exported: an app's own icons, checked at compile time.
ferrox-macros = { path = "../ferrox-macros", features = ["icons"] }

# build.rs checks every icons/*.svg (ferrox-icons-build: the same rules app
# icons follow) and generates one const per icon. The tests list the files
# the same way.
[build-dependencies]
ferrox-icons-build = { path = "../ferrox-icons-build" }

[dev-dependencies]
ferrox-icons-build = { path = "../ferrox-icons-build" }
