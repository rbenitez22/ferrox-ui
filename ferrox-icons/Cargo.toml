[package]
name        = "ferrox-icons"
description = "SVG icons for Leptos CSR apps: each icon a value, drawn by one Icon component."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
authors.workspace    = true
# One copy per build: Cargo allows one package per `links` value, so an app
# that pulls in two ferrox versions (a different tag, or the same tag through
# another URL) fails to resolve, naming both, instead of compiling two copies
# whose types, theme state and CSS don't mix. Not a native library.
links = "ferrox-icons"

[dependencies]
leptos = { workspace = true }

# build.rs checks every icons/*.svg and generates one const per icon. The
# tests include the same logic (build/), so they need the parser too.
[build-dependencies]
roxmltree = { workspace = true }

[dev-dependencies]
roxmltree = { workspace = true }
