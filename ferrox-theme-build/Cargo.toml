[package]
name        = "ferrox-theme-build"
description = "Build-script helper for ferrox-theme: validates theme files, embeds their metadata, and writes the CSS file and fonts an app links in index.html."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
authors.workspace    = true
# One copy per build: Cargo allows one package per `links` value, so an app
# that pulls in two ferrox versions (a different tag, or the same tag through
# another URL) fails to resolve, naming both, instead of compiling two copies
# whose types, theme state and CSS don't mix. Not a native library.
links = "ferrox-theme-build"

# Std only: an app's build script never compiles Leptos or web-sys.
[dependencies]
