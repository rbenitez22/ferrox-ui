# A ferrox-ui app, ready to rename: change `name` here and the title in
# index.html. Build and serve with `trunk serve` (http://127.0.0.1:3300).

[package]
name    = "starter"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
leptos = { version = "0.8.14", features = ["csr"] }
leptos_router = "0.8.10"
# ferrox-ui, pinned to one commit (a release tag once v0.1.0 is out).
# Add the features (groups) you use: overlay, forms, navigation, layout,
# data, menus.
ferrox-ui    = { git = "https://github.com/rbenitez22/ferrox-ui", rev = "ce7085984609a8a4433e6f4c6539bae45db2627a", features = ["overlay", "forms", "navigation", "layout", "data", "menus"] }
ferrox-theme = { git = "https://github.com/rbenitez22/ferrox-ui", rev = "ce7085984609a8a4433e6f4c6539bae45db2627a", features = ["leptos"] }
ferrox-icons = { git = "https://github.com/rbenitez22/ferrox-ui", rev = "ce7085984609a8a4433e6f4c6539bae45db2627a" }
# A local clone instead: these three and ferrox-theme-build's below replace
# the git lines (delete those, uncomment these, put the clone's folder in).
# ferrox-ui    = { path = "<clone>/ferrox-ui", features = ["overlay", "forms", "navigation", "layout", "data", "menus"] }
# ferrox-theme = { path = "<clone>/ferrox-theme", features = ["leptos"] }
# ferrox-icons = { path = "<clone>/ferrox-icons" }
web-sys      = { version = "0.3.83", features = ["Document", "Element", "HtmlElement", "Location", "Window"] }

[build-dependencies]
ferrox-theme-build = { git = "https://github.com/rbenitez22/ferrox-ui", rev = "ce7085984609a8a4433e6f4c6539bae45db2627a" }
# ferrox-theme-build = { path = "<clone>/ferrox-theme-build" }
