# A ferrox-ui app, ready to rename: change `name` here and the title in
# index.html. Build and serve with `trunk serve` (http://127.0.0.1:3300).

[package]
name    = "starter"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
leptos = { version = "0.8.14", features = ["csr"] }
leptos_router = "0.8.10"
# ferrox-ui and its sibling crates. Add the features (groups) you use:
# overlay, forms, navigation, layout, data, menus.
# Pinned to one release (the same tag on all four):
ferrox-ui    = { git = "https://github.com/rbenitez22/ferrox-ui", tag = "v0.1.1", features = ["overlay", "forms", "navigation", "layout", "data", "menus"] }
ferrox-theme = { git = "https://github.com/rbenitez22/ferrox-ui", tag = "v0.1.1", features = ["leptos"] }
ferrox-icons = { git = "https://github.com/rbenitez22/ferrox-ui", tag = "v0.1.1" }
# Or a local clone: delete the "Pinned" line and the git lines (these three
# and ferrox-theme-build's), uncomment these, put the clone's folder in.
# ferrox-ui    = { path = "<clone>/ferrox-ui", features = ["overlay", "forms", "navigation", "layout", "data", "menus"] }
# ferrox-theme = { path = "<clone>/ferrox-theme", features = ["leptos"] }
# ferrox-icons = { path = "<clone>/ferrox-icons" }
web-sys      = { version = "0.3.83", features = ["Document", "Element", "HtmlElement", "Location", "Window"] }

[build-dependencies]
ferrox-theme-build = { git = "https://github.com/rbenitez22/ferrox-ui", tag = "v0.1.1" }
# ferrox-theme-build = { path = "<clone>/ferrox-theme-build" }
