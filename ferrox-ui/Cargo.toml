[package]
name        = "ferrox-ui"
description = "UI primitives for Leptos CSR apps, in feature groups, styled by class-only CSS on ferrox-theme's tokens."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
authors.workspace    = true

# `core` (Button, IconButton, Toolbar) is always compiled. One feature per
# further group, added as each group is built: forms, menus, overlay,
# navigation, layout, data.
[features]
default = []
# Dialog, ConfirmDialog, Sheet: modals on the native <dialog> element.
overlay = []
# Field and the form controls.
forms = []
# NavList, NavLink, the side menu (on `Sheet`), and AppShell (with
# `layout`'s AppBar). The only group that needs leptos_router.
navigation = ["overlay", "layout", "dep:leptos_router"]
# Panel and Card: boxes that title and hold content.
layout = []
# DataView: record lists in a grid, a list, a strip or wrapping chips.
data = []
# Menu: actions behind a trigger.
menus = []

[dependencies]
ferrox-icons = { path = "../ferrox-icons" }
leptos  = { workspace = true }
leptos_router = { workspace = true, optional = true }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlHeadElement", "Node", "MouseEvent", "DomTokenList", "Event", "EventTarget", "HtmlDialogElement", "HtmlElement", "KeyboardEvent", "DomRect", "ScrollIntoViewOptions", "ScrollLogicalPosition", "IntersectionObserver", "IntersectionObserverEntry", "IntersectionObserverInit", "FocusEvent", "NodeList", "TouchEvent", "TouchList", "Touch"] }

# tests/docs_current.rs parses the source to check docs/ is current.
[dev-dependencies]
leptos_router = { workspace = true }
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
