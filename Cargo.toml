[workspace]
resolver = "3"
# Crates are added as they move in from webapp-lib (plans/ferrox-ui.md):
# ferrox-theme-build, ferrox-theme, demo, ferrox-ui, ferrox-icons.
members = ["ferrox-theme-build", "ferrox-theme", "ferrox-ui", "ferrox-icons", "demo"]
# The starter is an app to copy, not a member: it has its own lockfile and
# depends on ferrox-ui by git, as a copied app does.
exclude = ["starter"]

# One version for every crate in this repo; one git tag releases them all.
[workspace.package]
version      = "0.1.1"
edition      = "2024"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/rbenitez22/ferrox-ui"
authors      = ["Roberto Benitez"]

[workspace.dependencies]
leptos        = { version = "0.8.14", features = ["csr"] }
leptos_router = "0.8.10"
wasm-bindgen  = "0.2.106"
js-sys        = "0.3.83"
web-sys       = "0.3.83"
roxmltree     = "0.20"
