[package]
name        = "ferrox-theme"
description = "Token themes for Leptos CSR apps: families with light and dark halves, system/light/dark mode, a pre-paint script, and Leptos signals."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
authors.workspace    = true
# One copy per build: Cargo allows one package per `links` value, so an app
# that pulls in two ferrox versions (a different tag, or the same tag through
# another URL) fails to resolve, naming both, instead of compiling two copies
# whose types, theme state and CSS don't mix. Not a native library.
links = "ferrox-theme"

[features]
default = []
# provide_theme / use_theme: the theme as Leptos signals.
leptos = ["dep:leptos"]

[dependencies]
leptos       = { workspace = true, optional = true }
wasm-bindgen = { workspace = true }
web-sys      = { workspace = true, features = ["Window", "Document", "Element", "Storage", "MediaQueryList", "Event", "EventTarget"] }

[build-dependencies]
ferrox-theme-build = { path = "../ferrox-theme-build", version = "0.1.0" }

# The pre-paint script lives in ferrox-theme-build; a test checks it reads
# this crate's storage keys.
[dev-dependencies]
ferrox-theme-build = { path = "../ferrox-theme-build", version = "0.1.0" }
